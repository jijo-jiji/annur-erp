# Install to /etc/nginx/sites-available/annur and link it into sites-enabled (see DEPLOYMENT.md).
# Replace erp.example.com with the real address. HTTPS is added afterwards by:
#   sudo certbot --nginx -d erp.example.com
server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;

    # The built web app (uploaded from the developer's computer, see DEPLOYMENT.md)
    root /var/www/annur;
    index index.html;

    # Feedback videos can be up to 200 MB (Settings > Had & amaran); leave room for the form around the file
    client_max_body_size 210m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        # Overwrite, never append: the login limit counts by this address, so it must not be forgeable
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built files have a hash in their name, so they can be kept for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other address is a screen of the web app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
